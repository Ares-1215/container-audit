<!DOCTYPE html>
<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="彰化轉運中心移櫃確認稽核看板：交叉比對光罩與拆封紀錄，查核移櫃確認櫃號。">
<title>移櫃確認稽核</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<style>
:root{
  --bg:#f2f5f9;
  --card:#ffffff;
  --ink:#17212e; --ink2:#4f6076; --muted:#8493a8;
  --line:#dee5ee; --line2:#edf1f6;
  --accent:#0f766e; --accent-hi:#0c6058; --accent-soft:#dcefec; --accent-ink:#ffffff;
  --good:#2f9e5f; --good-text:#1d6b40; --good-bg:#e7f5ec;
  --warn:#dfa32b; --warn-text:#8a5a08; --warn-bg:#fcf3dd;
  --crit:#d64545; --crit-text:#a32222; --crit-bg:#fbe9e9;
  --chip-ink:#1c2430;
  --shadow:0 1px 2px rgba(23,33,46,.05),0 2px 8px rgba(23,33,46,.06);
  --shadow-lift:0 6px 18px rgba(23,33,46,.12);
  --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,Menlo,monospace;
  --grain-opacity:.035;
}
[data-theme="dark"]{
  --bg:#0c121b;
  --card:#151d29;
  --ink:#e4eaf3; --ink2:#9fb0c5; --muted:#6d7d93;
  --line:#263243; --line2:#1b2634;
  --accent:#23b5a5; --accent-hi:#2cc9b7; --accent-soft:#12302c; --accent-ink:#06231f;
  --good:#3ec573; --good-text:#7fdba1; --good-bg:#132b1c;
  --warn:#e3b23c; --warn-text:#f2ca74; --warn-bg:#30250f;
  --crit:#e46262; --crit-text:#ffa3a3; --crit-bg:#371818;
  --chip-ink:#e4eaf3;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 2px 10px rgba(0,0,0,.3);
  --shadow-lift:0 8px 22px rgba(0,0,0,.5);
  --grain-opacity:.06;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
::selection{background:var(--accent-soft);color:var(--ink)}
body{
  margin:0;
  font-family:"Segoe UI Variable Text","Segoe UI","Microsoft JhengHei","微軟正黑體",sans-serif;
  background:var(--bg);
  color:var(--ink);font-size:15px;line-height:1.55;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{
  display:flex;align-items:center;gap:12px;padding:12px 20px;
  background:color-mix(in srgb,var(--card) 85%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap;
}
header h1{font-size:1.12rem;margin:0;font-weight:700;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:.8rem}
.mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:9px;flex:none;
  background:var(--accent-soft);color:var(--accent);
}
.mark svg{display:block}
.spacer{flex:1}
button,select,input[type=text],input[type=password]{
  font:inherit;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:7px 13px;
  transition:border-color .18s,background-color .18s,color .18s,box-shadow .18s,transform .12s;
}
input[type=text]:focus,input[type=password]:focus,select:focus{
  border-color:var(--accent);outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);
}
button{cursor:pointer}
button:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
button.ghost{background:transparent}
button.ghost:hover{background:var(--line2)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 17px;box-shadow:var(--shadow);
}
.card .k{font-size:.76rem;color:var(--ink2);letter-spacing:.04em}
.card .v{font-family:var(--mono);font-size:1.7rem;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.card .v small{font-family:"Segoe UI Variable Text","Segoe UI","Microsoft JhengHei",sans-serif;font-size:.82rem;font-weight:400;color:var(--muted);letter-spacing:0}
.card.good{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.card.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.card.crit{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.card.good .v{color:var(--good-text)} .card.warn .v{color:var(--warn-text)} .card.crit .v{color:var(--crit-text)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 16px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:none;border-radius:0;padding:7px 13px;background:transparent}
.seg button:hover{background:var(--line2)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button.on:hover{background:var(--accent)}
.truckGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.truckCard{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 17px;box-shadow:var(--shadow);cursor:pointer;
  transition:border-color .15s;
}
.truckCard:hover{border-color:var(--accent)}
.truckCard .tc{font-family:var(--mono);font-size:1.05rem;font-weight:600}
.truckCard .td{color:var(--ink2);font-size:.83rem;margin-top:2px}
.truckCard .tm{color:var(--muted);font-size:.76rem;margin-top:6px}
.linky{cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;transition:color .15s}
.linky:hover{color:var(--accent-hi)}
.tag.mv{background:var(--warn-bg);color:var(--warn-text)}
.confirm{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;
}
.confirm .head{
  display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;padding:10px 16px;
  border-bottom:1px solid var(--line2);font-size:.85rem;color:var(--ink2);
  background:color-mix(in srgb,var(--bg) 45%,var(--card));
}
.confirm .head b{color:var(--ink);font-size:.94rem;font-weight:600}
.confirm .chips{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  border:1.5px solid;cursor:pointer;font-weight:600;font-size:.86rem;
  font-family:var(--mono);letter-spacing:.02em;
  color:var(--chip-ink);background:var(--card);
  transition:box-shadow .15s;
}
.chip .ico{font-size:.78rem}
.chip.green{background:var(--good-bg);border-color:var(--good)}
.chip.yellow{background:var(--warn-bg);border-color:var(--warn)}
.chip.red{background:var(--crit-bg);border-color:var(--crit)}
.chip:hover{box-shadow:var(--shadow)}
.mini{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.78rem;font-weight:600;margin-right:4px}
.mini.g{background:var(--good-bg);color:var(--good-text)}
.mini.y{background:var(--warn-bg);color:var(--warn-text)}
.mini.r{background:var(--crit-bg);color:var(--crit-text)}
.empty{color:var(--muted);text-align:center;padding:48px 0;font-size:.92rem}
.empty .ei{font-size:1.9rem;margin-bottom:8px;opacity:.75}
.skel{position:relative;overflow:hidden;background:var(--line2);border-radius:14px;margin-bottom:12px}
.skel::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--card) 65%,transparent),transparent);
  animation:shimmer 1.3s infinite;
}
.skel-card{height:110px}
@keyframes shimmer{to{transform:translateX(100%)}}
dialog{
  border:none;border-radius:16px;max-width:760px;width:calc(100vw - 32px);padding:0;
  background:var(--card);color:var(--ink);
  box-shadow:0 18px 50px rgba(5,10,18,.4);
}
dialog[open]{animation:dlgIn .22s cubic-bezier(.2,.9,.3,1)}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(8,13,20,.5);backdrop-filter:blur(3px)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:1.05rem;letter-spacing:-.01em}
.dlg-body{padding:14px 18px;max-height:72vh;overflow:auto}
.verdict-band{border-radius:11px;padding:10px 14px;margin-bottom:12px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.verdict-band.green{background:var(--good-bg);color:var(--good-text)}
.verdict-band.yellow{background:var(--warn-bg);color:var(--warn-text)}
.verdict-band.red{background:var(--crit-bg);color:var(--crit-text)}
.sec-title{font-size:.78rem;color:var(--muted);margin:16px 0 6px;font-weight:700;letter-spacing:.07em}
table{border-collapse:collapse;width:100%;font-size:.84rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
th,td{padding:6px 10px;text-align:left;white-space:nowrap}
thead th{
  background:color-mix(in srgb,var(--bg) 70%,var(--card));color:var(--muted);
  font-weight:600;font-size:.76rem;letter-spacing:.05em;position:sticky;top:0;
}
tbody tr{border-top:1px solid var(--line2);transition:background-color .12s}
tbody tr:hover{background:var(--line2)}
tr.zone,tbody tr.zone:hover{background:var(--good-bg)}
tr.zone td:first-child{font-weight:700}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.76rem;font-weight:600}
.tag.in{background:var(--good-bg);color:var(--good-text)}
.tag.out{background:var(--crit-bg);color:var(--crit-text)}
#gate{position:fixed;inset:0;background:var(--bg);background-image:radial-gradient(900px 480px at 50% -10%,color-mix(in srgb,var(--accent) 7%,var(--bg)) 0%,transparent 60%);display:flex;align-items:center;justify-content:center;z-index:50}
#gate .box{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:38px 40px;box-shadow:var(--shadow-lift);text-align:center;max-width:330px;
}
#gate .mark{width:44px;height:44px;border-radius:13px;margin-bottom:14px}
#gate h1{margin:0 0 6px;font-size:1.2rem;letter-spacing:-.01em}
#gate p{color:var(--muted);font-size:.85rem;margin:0 0 18px}
#gate input{width:100%;text-align:center;font-family:var(--mono);font-size:1.25rem;letter-spacing:8px;margin-bottom:12px}
#gate button{width:100%}
#gate .err{color:var(--crit-text);font-size:.82rem;min-height:1.2em;margin-top:8px}
.note{color:var(--muted);font-size:.78rem;margin-top:4px}
.tbl-wrap::-webkit-scrollbar,.dlg-body::-webkit-scrollbar{width:9px;height:9px}
.tbl-wrap::-webkit-scrollbar-thumb,.dlg-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.tbl-wrap::-webkit-scrollbar-thumb:hover,.dlg-body::-webkit-scrollbar-thumb:hover{background:var(--muted)}
@media (max-width:640px){
  header{padding:10px 12px} main{padding:12px 10px 40px}
  .confirm .head{gap:8px;font-size:.8rem}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <span class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg></span>
    <h1>移櫃確認稽核</h1>
    <p>彰化轉運中心｜請輸入通行碼</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="8" autofocus>
    <button class="primary" onclick="login()">進入</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<header style="display:none" id="hdr">
  <span class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg></span>
  <h1>移櫃確認稽核</h1>
  <span class="sub">移櫃站 4106彰化＋4150秀水</span>
  <div class="spacer"></div>
  <div class="seg" id="viewSeg">
    <button class="on" onclick="setView('audit',this)">逐櫃</button>
    <button onclick="setView('drivers',this)">司機</button>
    <button onclick="setView('trucks',this)">車頭</button>
  </div>
  <select id="dateSel" onchange="loadRun(this.value)"></select>
  <button class="ghost" onclick="exportExcel()" title="匯出目前日期的Excel報告">⬇ 匯出Excel</button>
  <button class="ghost" onclick="exportMonthly()" title="匯出整月彙總報告">⬇ 匯出月報</button>
  <button class="ghost" id="themeBtn" onclick="cycleTheme()">🌓</button>
</header>

<main style="display:none" id="mainEl">
 <div id="auditView">
  <div class="cards" id="cards"></div>
  <div class="toolbar">
    <div class="seg" id="filterSeg">
      <button data-f="all" class="on" onclick="setFilter('all',this)">全部</button>
      <button data-f="green" onclick="setFilter('green',this)">✓ 正常</button>
      <button data-f="yellow" onclick="setFilter('yellow',this)">⚠ 待複判</button>
      <button data-f="red" onclick="setFilter('red',this)">✕ 查無紀錄</button>
    </div>
    <input type="text" id="q" placeholder="搜尋櫃號／人員／車頭" style="flex:1;min-width:200px" oninput="render()">
    <span class="note" id="runInfo"></span>
  </div>
  <div id="list"></div>
 </div>
 <div id="driverView" style="display:none">
  <div class="toolbar" style="margin:6px 0 12px">
    <div class="seg" id="grpSeg">
      <button class="on" onclick="setGroup('driver',this)">依外聘司機</button>
      <button onclick="setGroup('staff',this)">依確認人員</button>
    </div>
    <span class="note" id="grpNote">在場時段＝車頭光罩實際進出場區｜「…」「未離站」為不完整時段，不計入停留合計</span>
  </div>
  <div id="driverTable"></div>
  <div class="note" style="margin-top:14px;line-height:1.9">
    <b>名詞說明</b><br>
    確認次數：確認人員在荷米斯APP按一次「移櫃確認」＝1 次，一次可含多個櫃號｜櫃數：各次確認回報的櫃號加總<br>
    逐櫃查核：綠＝確認當下櫃子在場域內｜黃＝櫃子有到過場域但時間對不上，待複判｜紅＝回溯期內查無該櫃任何場域紀錄<br>
    實際在場時段：車頭光罩實際進出彰化/秀水的時間（非表定班次）
  </div>
 </div>
 <div id="truckView" style="display:none">
  <div class="note" style="margin:6px 0 12px" id="truckNote">點卡片看表定班次與實際進出</div>
  <div class="truckGrid" id="truckGrid"></div>
 </div>
</main>

<dialog id="dlg">
  <div class="dlg-head">
    <h2 id="dlgTitle"></h2>
    <div class="spacer"></div>
    <button class="ghost" onclick="document.getElementById('dlg').close()">✕ 關閉</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<script>
const API = "https://hmqnlovyzlvvnkqmfwtt.supabase.co/functions/v1/caudit";
const V = {green:{ico:"✓",label:"正常"},yellow:{ico:"⚠",label:"待複判"},red:{ico:"✕",label:"查無紀錄"}};
const SKEL = `<div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div>`;
let token = localStorage.getItem("ca_token") || "";
let runs = [], cur = null, filter = "all";

async function api(body){
  const r = await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function login(){
  const pw = document.getElementById("pw").value.trim();
  document.getElementById("gateErr").textContent = "";
  try{
    runs = (await api({action:"list_runs",token:pw})).runs;
    token = pw; localStorage.setItem("ca_token",pw);
    enter();
  }catch(e){ document.getElementById("gateErr").textContent = "通行碼錯誤或連線失敗"; }
}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

function enter(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("hdr").style.display = "";
  document.getElementById("mainEl").style.display = "";
  const sel = document.getElementById("dateSel");
  sel.innerHTML = runs.map(r=>`<option value="${r.query_date}">${r.query_date}（綠${r.summary.green??"?"} 黃${r.summary.yellow??"?"} 紅${r.summary.red??"?"}）</option>`).join("");
  if(runs.length) loadRun(runs[0].query_date);
  else document.getElementById("list").innerHTML = `<div class="empty"><div class="ei">📭</div>還沒有稽核資料</div>`;
}
async function loadRun(date){
  document.getElementById("list").innerHTML = SKEL;
  try{
    cur = await api({action:"get_run",token,date});
    cur.itemsByConfirm = {};
    for(const it of cur.items){
      (cur.itemsByConfirm[it.confirm_id] ??= []).push(it);
    }
    render();
    if(view==="drivers") renderDrivers();
    if(view==="trucks") renderTrucks();
  }catch(e){ document.getElementById("list").innerHTML = `<div class="empty">載入失敗：${e.message}</div>`; }
}
function setFilter(f,btn){
  filter = f;
  document.querySelectorAll("#filterSeg button").forEach(b=>b.classList.toggle("on",b===btn));
  render();
}
function fmtTs(iso){ return iso ? iso.slice(5,16).replace("T"," ") : ""; }
function render(){
  if(!cur) return;
  const s = cur.run.summary || {};
  document.getElementById("cards").innerHTML = `
    <div class="card"><div class="k">移櫃確認</div><div class="v">${s.confirms??cur.confirms.length}<small> 筆</small></div></div>
    <div class="card"><div class="k">比對櫃次</div><div class="v">${s.items??cur.items.length}<small> 項（${s.containers??"?"} 櫃）</small></div></div>
    <div class="card good"><div class="k">✓ 正常</div><div class="v">${s.green??0}</div></div>
    <div class="card warn"><div class="k">⚠ 待複判</div><div class="v">${s.yellow??0}</div></div>
    <div class="card crit"><div class="k">✕ 查無紀錄</div><div class="v">${s.red??0}</div></div>`;
  document.getElementById("runInfo").textContent =
    `回溯 ${cur.run.lookback_days} 天｜抓取於 ${fmtTs(cur.run.fetched_at)}`;
  const q = document.getElementById("q").value.trim().toLowerCase();
  let html = "";
  for(const cf of cur.confirms){
    let items = cur.itemsByConfirm[cf.id] || [];
    if(filter!=="all") items = items.filter(i=>i.verdict===filter);
    if(q){
      const hay = `${cf.driver} ${cf.confirm_staff} ${cf.truck}`.toLowerCase();
      items = hay.includes(q) ? items : items.filter(i=>i.container_no.includes(q));
    }
    if(!items.length) continue;
    html += `<div class="confirm">
      <div class="head">
        <span>移櫃日 <b>${cf.move_date}</b></span>
        <span>移櫃站 <b>${cf.move_station||""}</b></span>
        <span>車頭 <b class="linky" onclick="openTruckByLabel('${cf.truck}')">${cf.truck}</b></span>
        <span>司機 <b>${cf.driver}</b></span>
        <span>確認 <b>${cf.confirm_staff}</b> @ ${cf.confirm_time_raw}（${cf.confirm_station}）</span>
        <span>櫃數 <b>${cf.box_count}</b></span>
      </div>
      <div class="chips">${items.map(i=>
        `<span class="chip ${i.verdict}" onclick="openItem(${i.id})" title="${V[i.verdict].label}">
           <span class="ico">${V[i.verdict].ico}</span>${i.container_no}</span>`).join("")}
      </div></div>`;
  }
  document.getElementById("list").innerHTML = html || `<div class="empty"><div class="ei">🔎</div>沒有符合條件的資料</div>`;
}

/* 司機彙總 */
function parseMD(ts){ // "MM/DD HH:MM" → 分鐘（跨月極端情況不處理，單日資料足夠）
  const m = ts.match(/(\d{2})\/(\d{2}) (\d{2}):(\d{2})/);
  return m ? ((+m[1])*31+(+m[2]))*1440 + (+m[3])*60 + (+m[4]) : null;
}
function zoneIntervals(gates){
  const zs = (gates||[]).filter(g=>ZONE_CODES.some(c=>g.station.startsWith(c)) && (g.kind==="進站"||g.kind==="離站"));
  const ivs = []; let open = null;
  for(const g of zs){
    if(g.kind==="進站"){ if(!open) open = g.ts; }
    else { ivs.push([open, g.ts]); open = null; }
  }
  if(open) ivs.push([open, null]);
  // 相鄰時段間隔 ≤15 分鐘視為連續（彰化↔秀水間短暫轉場）
  const merged = [];
  for(const iv of ivs){
    const last = merged[merged.length-1];
    if(last && last[1] && iv[0] && parseMD(iv[0]) - parseMD(last[1]) <= 15) last[1] = iv[1];
    else merged.push([...iv]);
  }
  return merged;
}
function fmtDur(mins){
  if(mins == null) return "—";
  return `${Math.floor(mins/60)} 時 ${mins%60} 分`;
}
function computeDrivers(byTruck, data=cur){
  // 依 司機+車頭 分組，附車頭在場時段與停留合計（data 可為跨日合併資料，供月報用）
  const groups = {};
  for(const cf of data.confirms){
    const code = (cf.truck||"").trim().split(/\s+/)[0];
    const key = `${cf.driver}|${code}`;
    (groups[key] ??= {driver:cf.driver, truck:cf.truck, code, n:0, boxes:0, g:0, y:0, r:0, confirms:[]}).n++;
    groups[key].boxes += cf.box_count||0;
    groups[key].confirms.push({time:cf.confirm_time_raw, staff:cf.confirm_staff, boxes:cf.box_count||0});
    for(const it of (data.itemsByConfirm[cf.id]||[]))
      groups[key][it.verdict==="green"?"g":it.verdict==="yellow"?"y":"r"]++;
  }
  const rows = Object.values(groups).sort((a,b)=>(b.r-a.r)||(b.y-a.y)||(b.boxes-a.boxes));
  for(const d of rows){
    d.confirms.sort((a,b)=>a.time.localeCompare(b.time));
    d.detail = d.confirms.map(c=>`${c.time} ${c.staff} ${c.boxes}櫃`);
    const t = byTruck[d.code];
    d.ivList = null; d.dur = null;
    if(t){
      const ivs = zoneIntervals(t.gates);
      d.ivList = ivs.map(([a,b])=>`${a||"…"}～${b||"未離站"}`);
      d.dur = ivs.reduce((s,[a,b])=>(a&&b)? s+(parseMD(b)-parseMD(a)) : s, 0);
      if(!ivs.length) d.dur = null;
    }
  }
  return rows;
}

/* 依確認人員分組：誰在什麼時間叫了哪位外聘司機、幾櫃 */
function computeStaff(data=cur){
  const groups = {};
  for(const cf of data.confirms){
    const g = (groups[cf.confirm_staff] ??= {staff:cf.confirm_staff, n:0, boxes:0, g:0, y:0, r:0, drivers:{}, confirms:[]});
    g.n++; g.boxes += cf.box_count||0;
    const code = (cf.truck||"").trim().split(/\s+/)[0];
    const dk = `${cf.driver}|${code}`;
    (g.drivers[dk] ??= {driver:cf.driver, code, n:0}).n++;
    g.confirms.push({time:cf.confirm_time_raw, driver:cf.driver, code, boxes:cf.box_count||0});
    for(const it of (data.itemsByConfirm[cf.id]||[]))
      g[it.verdict==="green"?"g":it.verdict==="yellow"?"y":"r"]++;
  }
  const rows = Object.values(groups).sort((a,b)=>(b.r-a.r)||(b.y-a.y)||(b.n-a.n));
  for(const s of rows){
    s.confirms.sort((a,b)=>a.time.localeCompare(b.time));
    s.detail = s.confirms.map(c=>`${c.time} ${c.driver}（${c.code}）${c.boxes}櫃`);
  }
  return rows;
}

    const r = aoa.length;
    if(b.type==="title"){ aoa.push([b.text]); merges.push(full(r)); rowsH[r]={hpt:30}; styles.push([r,0,ST.title]); }
    else if(b.type==="sub"){ aoa.push([b.text]); merges.push(full(r)); rowsH[r]={hpt:18}; styles.push([r,0,ST.sub]); }
    else if(b.type==="gap"){ aoa.push([]); rowsH[r]={hpt:6}; }
    else if(b.type==="sec"){ aoa.push([b.text]); merges.push(full(r)); rowsH[r]={hpt:22}; styles.push([r,0,ST.sec]); }
    else if(b.type==="kpi"){
      aoa.push(b.head); rowsH[r]={hpt:22}; b.head.forEach((_,c)=>styles.push([r,c,ST.head]));
      aoa.push(b.vals); rowsH[r+1]={hpt:26}; b.vals.forEach((_,c)=>styles.push([r+1,c,kpiV(b.inks?.[c])]));
      fitSrc.push(b.head,b.vals);
    }
    else if(b.type==="table"){
      aoa.push(b.head); rowsH[r]={hpt:24}; b.head.forEach((_,c)=>styles.push([r,c,ST.head])); fitSrc.push(b.head);
      if(!b.rows.length && b.empty){
        aoa.push([b.empty]); merges.push({s:{r:r+1,c:0},e:{r:r+1,c:b.head.length-1}}); styles.push([r+1,0,ST.cellL]);
      }
      b.rows.forEach((row,i)=>{
        aoa.push(row); fitSrc.push(row);
        const fill = b.fill ? b.fill(row,i) : null;
        row.forEach((_,c)=>{
          const st = clone((b.left||[]).includes(c) ? ST.cellL : ST.cell);
          if(fill) st.fill = {fgColor:{rgb:fill}};
          const ink = b.ink ? b.ink(row,i,c) : null; if(ink) st.font.color = {rgb:ink};
          styles.push([r+1+i,c,st]);
        });
      });
      if(b.autofilter && b.rows.length) af = {r0:r, r1:r+b.rows.length, c1:b.head.length-1};
    }
    else if(b.type==="gloss"){
      b.lines.forEach((t,i)=>{ aoa.push([t]); merges.push(full(r+i)); rowsH[r+i]={hpt:32}; styles.push([r+i,0,ST.gloss]); });
    }
    else if(b.type==="sign"){
      const third = Math.max(1, Math.floor(ncols/3));
      const row = new Array(ncols).fill("");
      row[0] = `製表：${REPORT_AUTHOR}`; row[third] = "複核："; row[2*third] = "主管核示：";
      aoa.push(row); rowsH[r]={hpt:42};
      merges.push({s:{r,c:0},e:{r,c:third-1}},{s:{r,c:third},e:{r,c:2*third-1}},{s:{r,c:2*third},e:{r,c:LAST}});
      [0,third,2*third].forEach(c=>styles.push([r,c,ST.sign]));
    }
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!merges"]=merges; ws["!rows"]=rowsH; ws["!cols"]=fitCols(fitSrc);
  for(const [r,c,st] of styles) put(ws,r,c,st);
  if(af) ws["!autofilter"] = {ref:`${XLSX.utils.encode_cell({r:af.r0,c:0})}:${XLSX.utils.encode_cell({r:af.r1,c:af.c1})}`};
  return ws;
}
/* 逐櫃位置證據：確認前最後光罩、確認後首次到場域、一句話結論 */
const isoToRaw = iso => iso ? `${iso.slice(5,7)}/${iso.slice(8,10)} ${iso.slice(11,16)}` : "";
function itemPosition(it, cf){
  const ev = it.evidence||{}, cm = parseMD(cf.confirm_time_raw||"");
  const ge = ev.gate_events||[];
  const beforeEv = cm==null ? null : ge.filter(e=>parseMD(isoToRaw(e.ts)) <= cm).pop();
  const before = beforeEv ? `${beforeEv.station} ${beforeEv.kind} ${isoToRaw(beforeEv.ts)}` : "回溯期內無光罩";
  const trAfter = (ev.trips||[]).filter(l=>ZONE_NAMES.includes(l.to) && l.act_arr && cm!=null && parseMD(l.act_arr) > cm)
                    .sort((a,b)=>parseMD(a.act_arr)-parseMD(b.act_arr))[0];
  const gAfter = cm==null ? null : ge.find(e=>ZONE_CODES.includes(e.station_code) && e.kind==="進站" && parseMD(isoToRaw(e.ts)) > cm);
  let after = "—", afterMin = null, carrier = "";
  if(trAfter){ after = `${trAfter.act_arr} ${trAfter.driver}（${trAfter.trip}）`; afterMin = parseMD(trAfter.act_arr); carrier = trAfter.driver; }
  else if(gAfter){ after = `${isoToRaw(gAfter.ts)} ${gAfter.driver}（${gAfter.trip}）`; afterMin = parseMD(isoToRaw(gAfter.ts)); carrier = gAfter.driver; }
  const gapH = afterMin!=null ? Math.round((afterMin-cm)/6)/10 : null;
  let conclusion;
  if(it.verdict==="green") conclusion = it.reason || "確認時櫃子在場域內";
  else{
    const inZone = beforeEv && ZONE_CODES.includes(beforeEv.station_code);
    const where = !beforeEv ? "確認前回溯期內查無任何光罩"
      : inZone ? `確認前最後光罩在${beforeEv.station}（${beforeEv.kind} ${isoToRaw(beforeEv.ts)}）`
      : `確認時櫃子最後位置在${beforeEv.station}（${isoToRaw(beforeEv.ts)}）`;
    const then = afterMin!=null ? `，${gapH} 小時後才由 ${carrier} 載抵場域` : "，之後回溯期內未再進入場域";
    conclusion = where + then + (it.verdict==="red" ? "。建議調閱該司機移櫃確認畫面對質" : "，請複判");
  }
  return {before, after, gapH, conclusion};
}
/* 把一天（或多天合併）的資料整理成報表列 */
function reportRows(data, date){
  const rows = [];
  for(const cf of data.confirms)
    for(const it of (data.itemsByConfirm[cf.id]||[]))
      rows.push({date: date||cf.query_date, cf, it, pos: itemPosition(it, cf)});
  const ord = {red:0, yellow:1, green:2};
  rows.sort((a,b)=>(ord[a.it.verdict]-ord[b.it.verdict]) || a.date.localeCompare(b.date));
  return rows;
}
const stamp = ()=>{ const n=new Date(), p=x=>String(x).padStart(2,"0"); return `${p(n.getMonth()+1)}/${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}`; };
const subLine = left => `${left}｜場區：彰化/秀水｜製表單位：${REPORT_ORG}｜製表人：${REPORT_AUTHOR}｜產出 ${stamp()}`;
const fillV = v => XL.FILL[v], inkV = v => XL.INK[v];
function tableDrivers(drivers, withPresence){
  const head = ["外聘司機","車頭","確認次數","櫃數","綠","黃","紅","確認明細（時間・確認人員・櫃數）"];
  if(withPresence) head.push("實際在場時段","停留合計");
  const rows = drivers.map(d=>{
    const r = [d.driver, d.truck, d.n, d.boxes, d.g||0, d.y||0, d.r||0, d.detail.join("\n")];
    if(withPresence) r.push(d.ivList===null?"無車頭資料":(d.ivList.length?d.ivList.join("\n"):"當日無場區光罩"), d.dur==null?"—":fmtDur(d.dur));
    return r;
  });
  return {type:"table", head, rows, left:[0,7,8],
    fill:(row,i)=>drivers[i].r?XL.FILL.red:drivers[i].y?XL.FILL.yellow:null,
    ink:(row,i,c)=>(c===4&&drivers[i].g)?XL.INK.green:(c===5&&drivers[i].y)?XL.INK.yellow:(c===6&&drivers[i].r)?XL.INK.red:null,
    empty:"本期無外聘移櫃確認"};
}
function tableStaff(staff){
  return {type:"table", head:["確認人員","確認次數","櫃數","綠","黃","紅","外聘司機（車頭）×次數","確認明細（時間・司機・櫃數）"],
    rows: staff.map(s=>[s.staff, s.n, s.boxes, s.g||0, s.y||0, s.r||0,
      Object.values(s.drivers).map(v=>`${v.driver}（${v.code}）×${v.n}`).join("\n"), s.detail.join("\n")]),
    left:[0,6,7],
    fill:(row,i)=>staff[i].r?XL.FILL.red:staff[i].y?XL.FILL.yellow:null,
    ink:(row,i,c)=>(c===3&&staff[i].g)?XL.INK.green:(c===4&&staff[i].y)?XL.INK.yellow:(c===5&&staff[i].r)?XL.INK.red:null,
    empty:"本期無資料"};
}
function sheetAudit(rows, withDate){
  const flags = rows.filter(x=>x.it.verdict!=="green");
  const head = [...(withDate?["查核日"]:[]), "燈號","櫃號","移櫃站","確認人員","確認時間","外聘司機（車頭）","確認前最後位置","確認後首次到場域","結論"];
  const body = flags.map(x=>[...(withDate?[x.date]:[]), V[x.it.verdict].label, x.it.container_no, x.cf.move_station, x.cf.confirm_staff,
    x.cf.confirm_time_raw, `${x.cf.driver}（${x.cf.truck}）`, x.pos.before, x.pos.after, x.pos.conclusion]);
  const off = withDate?1:0;
  return buildSheet([
    {type:"title", text:`需追查項目（${flags.length} 項）`},
    {type:"table", head, rows: body, left:[off+5,off+6,off+7,off+8], autofilter:true,
      fill:(row,i)=>fillV(flags[i].it.verdict), ink:(row,i,c)=>c===off?inkV(flags[i].it.verdict):null,
      empty:"本期無需追查項目 ✓"},
  ], head.length);
}
function sheetDetail(rows, withDate){
  const head = [...(withDate?["查核日"]:[]), "移櫃日","移櫃站","車頭","司機","確認人員","確認時間","櫃號","燈號","確認前最後光罩","確認後首次進場區","判定理由"];
  const body = rows.map(x=>[...(withDate?[x.date]:[]), x.cf.move_date, x.cf.move_station, x.cf.truck, x.cf.driver, x.cf.confirm_staff,
    x.cf.confirm_time_raw, x.it.container_no, V[x.it.verdict].label, x.pos.before, x.pos.after, x.it.reason||""]);
  const off = withDate?1:0;
  return buildSheet([
    {type:"title", text:`逐櫃明細（${rows.length} 櫃次）`},
    {type:"table", head, rows: body, left:[off+3,off+8,off+9,off+10], autofilter:true,
      fill:(row,i)=>fillV(rows[i].it.verdict), ink:(row,i,c)=>c===off+7?inkV(rows[i].it.verdict):null, empty:"本期無資料"},
  ], head.length);
}
function sheetLegs(trucks){
  const body = [], meta = [];
  for(const t of trucks) for(const l of (t.legs||[])){
    body.push([t.truck_label||t.truck_code, t.driver||"", l.seq, l.trip, l.from, l.to, l.plan_dep, l.act_dep||"—", l.plan_arr, l.act_arr||"—", l.container||"", l.note||""]);
    meta.push({zone: ZONE_NAMES.some(n=>l.from===n||l.to===n), noGate: !!(l.container && l.container!=="取消" && !l.act_dep && !l.act_arr)});
  }
  const head = ["車頭","司機","序","班次","起站","迄站","預定離","實際離","預定進","實際進","櫃號","備註"];
  return buildSheet([
    {type:"title", text:`車頭班次明細（${trucks.length} 台｜表定 vs 實際｜綠底＝進出場域、黃底＝有排櫃號但無光罩）`},
    {type:"table", head, rows: body, left:[0,1,3,11], autofilter:true,
      fill:(row,i)=>meta[i].noGate?XL.FILL.yellow:meta[i].zone?XL.FILL.green:null, empty:"本日無車頭資料"},
  ], head.length);
}
async function exportExcel(){
  if(!cur) return;
  try{ await ensureXLSX(); }catch(e){ alert(e.message); return; }
  const date = cur.run.query_date;
  let trucks = []; try{ trucks = await getTrucks(date); }catch(e){}
  const byTruck = Object.fromEntries(trucks.map(t=>[t.truck_code,t]));
  const drivers = computeDrivers(byTruck), staff = computeStaff(), s = cur.run.summary||{};
  const rows = reportRows(cur, date);
  const ws1 = buildSheet([
    {type:"title", text:`${REPORT_ORG} 移櫃確認稽核報告`},
    {type:"sub", text: subLine(`查核日期 ${date}`)},
    {type:"gap"},
    {type:"kpi", head:["移櫃確認(次)","比對櫃次","不重複櫃號","✓ 正常","⚠ 待複判","✕ 查無紀錄"],
      vals:[s.confirms??cur.confirms.length, s.items??cur.items.length, s.containers??"—", s.green??0, s.yellow??0, s.red??0],
      inks:[null,null,null,XL.INK.green,XL.INK.yellow,XL.INK.red]},
    {type:"gap"},
    {type:"sec", text:"外聘司機彙總（依紅→黃→櫃數排序）"}, tableDrivers(drivers, true),
    {type:"gap"},
    {type:"sec", text:"確認人員彙總（誰在什麼時間叫了外聘司機）"}, tableStaff(staff),
    {type:"gap"},
    {type:"sec", text:"名詞說明"}, {type:"gloss", lines:GLOSS},
    {type:"gap"}, {type:"sign"},
  ], 10);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, "總覽");
  XLSX.utils.book_append_sheet(wb, sheetAudit(rows,false), "需追查");
  XLSX.utils.book_append_sheet(wb, sheetDetail(rows,false), "逐櫃明細");
  XLSX.utils.book_append_sheet(wb, sheetLegs(trucks), "車頭班次明細");
  wb.Workbook = {Names:[
    {Name:"_xlnm.Print_Titles", Sheet:1, Ref:"'需追查'!$1:$2"},
    {Name:"_xlnm.Print_Titles", Sheet:2, Ref:"'逐櫃明細'!$1:$2"},
    {Name:"_xlnm.Print_Titles", Sheet:3, Ref:"'車頭班次明細'!$1:$2"},
  ]};
  XLSX.writeFile(wb, `移櫃稽核報告_${date}.xlsx`);
}
/* 月報：整月每日趨勢、外聘司機／確認人員月累計、全月需追查與逐櫃明細 */
async function exportMonthly(){
  if(!runs.length) return;
  const month = prompt("匯出月份（YYYY-MM）", (cur?.run.query_date||runs[0].query_date).slice(0,7));
  if(!month || !/^\d{4}-\d{2}$/.test(month)) return;
  const days = runs.filter(r=>r.query_date.startsWith(month)).sort((a,b)=>a.query_date.localeCompare(b.query_date));
  if(!days.length){ alert(`${month} 沒有稽核資料`); return; }
  try{ await ensureXLSX(); }catch(e){ alert(e.message); return; }
  const btn = [...document.querySelectorAll("header button")].find(b=>b.textContent.includes("月報"));
  if(btn) btn.textContent = "產生中…";
  try{
    const merged = {confirms:[], itemsByConfirm:{}}, rows = [], trend = [];
    for(const d of days){
      const data = await api({action:"get_run", token, date:d.query_date});
      data.itemsByConfirm = {};
      for(const it of data.items) (data.itemsByConfirm[it.confirm_id] ??= []).push(it);
      for(const cf of data.confirms) cf.query_date = d.query_date;
      merged.confirms.push(...data.confirms); Object.assign(merged.itemsByConfirm, data.itemsByConfirm);
      rows.push(...reportRows(data, d.query_date));
      const s = d.summary||{};
      trend.push([d.query_date, s.confirms??data.confirms.length, s.items??data.items.length, s.green??0, s.yellow??0, s.red??0]);
    }
    const ord = {red:0, yellow:1, green:2};
    rows.sort((a,b)=>(ord[a.it.verdict]-ord[b.it.verdict]) || a.date.localeCompare(b.date));
    const tot = trend.reduce((a,r)=>[null, a[1]+r[1], a[2]+r[2], a[3]+r[3], a[4]+r[4], a[5]+r[5]], [null,0,0,0,0,0]);
    const drivers = computeDrivers({}, merged), staff = computeStaff(merged);
    const ws1 = buildSheet([
      {type:"title", text:`${REPORT_ORG} 移櫃確認稽核月報`},
      {type:"sub", text: subLine(`統計月份 ${month}（${days.length} 天）`)},
      {type:"gap"},
      {type:"kpi", head:["移櫃確認(次)","比對櫃次","✓ 正常","⚠ 待複判","✕ 查無紀錄","正常率"],
        vals:[tot[1], tot[2], tot[3], tot[4], tot[5], tot[2]?`${(tot[3]/tot[2]*100).toFixed(1)}%`:"—"],
        inks:[null,null,XL.INK.green,XL.INK.yellow,XL.INK.red,null]},
      {type:"gap"},
      {type:"sec", text:"每日趨勢"},
      {type:"table", head:["查核日","確認次數","櫃次","綠","黃","紅"], rows:trend, left:[],
        fill:(row)=>row[5]?XL.FILL.red:row[4]?XL.FILL.yellow:null,
        ink:(row,i,c)=>(c===3&&row[3])?XL.INK.green:(c===4&&row[4])?XL.INK.yellow:(c===5&&row[5])?XL.INK.red:null},
      {type:"gap"},
      {type:"sec", text:"外聘司機月累計（依紅→黃→櫃數排序）"}, tableDrivers(drivers, false),
      {type:"gap"},
      {type:"sec", text:"確認人員月累計"}, tableStaff(staff),
      {type:"gap"},
      {type:"sec", text:"名詞說明"}, {type:"gloss", lines:GLOSS},
      {type:"gap"}, {type:"sign"},
    ], 8);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws1, "月總覽");
    XLSX.utils.book_append_sheet(wb, sheetAudit(rows,true), "全月需追查");
    XLSX.utils.book_append_sheet(wb, sheetDetail(rows,true), "全月逐櫃明細");
    wb.Workbook = {Names:[
      {Name:"_xlnm.Print_Titles", Sheet:1, Ref:"'全月需追查'!$1:$2"},
      {Name:"_xlnm.Print_Titles", Sheet:2, Ref:"'全月逐櫃明細'!$1:$2"},
    ]};
    XLSX.writeFile(wb, `移櫃稽核月報_${month}.xlsx`);
  }catch(e){ alert("月報產生失敗："+e.message); }
  finally{ if(btn) btn.textContent = "⬇ 匯出月報"; }
}
/* 彈窗：點背景關閉 */
document.getElementById("dlg").addEventListener("click",e=>{
  if(e.target===e.currentTarget) e.currentTarget.close();
});
/* 主題 */
const THEMES = ["auto","light","dark"];
function applyTheme(t){
  const real = t==="auto" ? (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light") : t;
  document.documentElement.dataset.theme = real;
  document.getElementById("themeBtn").textContent = t==="auto"?"🌓":(t==="dark"?"🌙":"☀️");
}
function cycleTheme(){
  const t = THEMES[(THEMES.indexOf(localStorage.getItem("ca_theme")||"auto")+1)%3];
  localStorage.setItem("ca_theme",t); applyTheme(t);
}
applyTheme(localStorage.getItem("ca_theme")||"auto");
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>applyTheme(localStorage.getItem("ca_theme")||"auto"));

if(token){
  api({action:"list_runs",token}).then(j=>{runs=j.runs;enter();}).catch(()=>{});
}
